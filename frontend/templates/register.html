{% extends 'base.html' %}
{% block title %}Register | EcoScrap Pro{% endblock %}

{% block content %}
<section class="min-h-screen px-4 py-12 bg-[radial-gradient(circle_at_top_left,#a7f3d0,transparent_35%),radial-gradient(circle_at_bottom_right,#86efac,transparent_35%)]">
  <div class="max-w-lg mx-auto bg-white rounded-3xl p-8 shadow-lg border border-eco-100">
    <h1 class="font-heading text-3xl font-bold text-eco-700">Create Customer Account</h1>
    <p class="text-slate-600 mt-2">Register and schedule your first scrap pickup.</p>

    <form action="{{ url_for('register') }}" method="POST" class="mt-6 space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Full Name</label>
        <input type="text" name="full_name" required class="w-full border border-eco-100 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-eco-500" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" name="email" required class="w-full border border-eco-100 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-eco-500" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Phone</label>
        <input type="text" name="phone" required class="w-full border border-eco-100 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-eco-500" />
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Address</label>
        <textarea name="address" rows="2" class="w-full border border-eco-100 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-eco-500"></textarea>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" name="password" required class="w-full border border-eco-100 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-eco-500" />
      </div>

      <button type="submit" class="w-full py-3 bg-eco-500 text-white font-semibold rounded-xl hover:bg-eco-700 transition">Register</button>
    </form>

    <p class="mt-4 text-sm">Already have an account? <a class="text-eco-700 font-semibold underline" href="{{ url_for('login') }}">Login</a></p>
  </div>
</section>
{% endblock %}
