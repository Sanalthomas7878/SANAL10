{% extends 'base.html' %}

{% block content %}
<div style="padding: 2rem 0;">
    <h1 style="text-align: center; margin-bottom: 1rem;">Our Services</h1>
    <p style="text-align: center; color: var(--text-secondary);">Beyond scrap, we offer a range of essential home services to keep your living space pristine.</p>

    <div class="grid">
        {% for service in services %}
        <div class="card">
            <h3 style="margin-bottom: 1rem; color: var(--primary-dark);">{{ service.name }}</h3>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">{{ service.desc }}</p>
            <a href="{{ url_for('booking') }}" class="btn btn-primary" style="width: 100%;">Book Now</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
