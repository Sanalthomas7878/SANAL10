<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Aluminum rolls in a factory</title>
  <desc id="desc">A row of large aluminum coils in a blue industrial warehouse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#16304d" />
      <stop offset="0.45" stop-color="#2d5f8d" />
      <stop offset="1" stop-color="#88b2da" />
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14314c" />
      <stop offset="0.5" stop-color="#2d5d88" />
      <stop offset="1" stop-color="#d3e4f6" />
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#7d8ea4" />
      <stop offset="0.18" stop-color="#edf4fb" />
