      <ellipse cx="0" cy="0" rx="89" ry="100" fill="none" stroke="#eff6fd" stroke-opacity="0.5" stroke-width="1.4" />
      <ellipse cx="0" cy="0" rx="78" ry="88" fill="none" stroke="#708398" stroke-opacity="0.45" stroke-width="1.2" />
